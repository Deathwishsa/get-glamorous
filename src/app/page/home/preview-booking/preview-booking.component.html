<section class="cta-banner" aria-label="Call to action">
  <div class="cta-banner__glow" aria-hidden="true"></div>
  <div class="cta-banner__inner container">

    <div class="cta-banner__text">
      <h2 class="cta-banner__heading">Ready for your next glam transformation?</h2>
      <p class="cta-banner__sub">Limited appointments available — secure yours today.</p>
    </div>

    <a [routerLink]="business.ctaRoute" class="btn-primary cta-banner__btn">
      <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
      {{ business.ctaLabel }}
    </a>

  </div>
</section>
