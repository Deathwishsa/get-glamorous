<section class="about section" aria-label="About Get Glamorous">
  <div class="about__inner container">

    <div class="about__text">
      <span class="section-label">The Story Behind the Studio</span>
      <h2 class="section-heading">Your luxury beauty destination in Cape Town</h2>
      <p class="section-subheading">{{ business.shortBio }}</p>
      <a [routerLink]="business.ctaRoute" class="btn-primary">
        <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
        Book Your Appointment
      </a>
    </div>

    <div class="about__media">
      <div class="about__image" aria-hidden="true"></div>
      <div class="about__badge-floating">
        <i class="fa-solid fa-scissors" aria-hidden="true"></i>
        <span>5+ Years<br>of Excellence</span>
      </div>
    </div>

  </div>
</section>
